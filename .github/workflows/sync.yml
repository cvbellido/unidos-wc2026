name: Sync WC results

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/sync-results
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://unidos-wc2026.vercel.app/api/sync-results)
          echo "HTTP $HTTP_CODE"
          cat /tmp/body.txt
          echo
          test "$HTTP_CODE" = "200"
